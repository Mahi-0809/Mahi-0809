<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#FFF8F0" />
  
  <!-- Accent lines top -->
  <rect x="0" y="32" width="1200" height="3" fill="#6B1D2A" opacity="0.8" />
  <rect x="0" y="38" width="1200" height="1" fill="#6B1D2A" opacity="0.8" />
  
  <!-- Accent lines bottom -->
  <rect x="0" y="361" width="1200" height="1" fill="#6B1D2A" opacity="0.8" />
  <rect x="0" y="365" width="1200" height="3" fill="#6B1D2A" opacity="0.8" />

  <!-- Corner motifs -->
  <g fill="none" stroke="#6B1D2A">
    <!-- Top Left -->
    <g transform="translate(0, 0)">
      <circle r="40" stroke-width="1" opacity="0.10" />
      <circle r="30" stroke-width="0.8" opacity="0.08" />
      <circle r="15" stroke-width="0.5" opacity="0.06" />
    </g>
    <!-- Top Right -->
    <g transform="translate(1200, 0)">
      <circle r="40" stroke-width="1" opacity="0.10" />
      <circle r="30" stroke-width="0.8" opacity="0.08" />
      <circle r="15" stroke-width="0.5" opacity="0.06" />
    </g>
    <!-- Bottom Left -->
    <g transform="translate(0, 400)">
      <circle r="40" stroke-width="1" opacity="0.10" />
      <circle r="30" stroke-width="0.8" opacity="0.08" />
      <circle r="15" stroke-width="0.5" opacity="0.06" />
    </g>
    <!-- Bottom Right -->
    <g transform="translate(1200, 400)">
      <circle r="40" stroke-width="1" opacity="0.10" />
      <circle r="30" stroke-width="0.8" opacity="0.08" />
      <circle r="15" stroke-width="0.5" opacity="0.06" />
    </g>
  </g>

  <!-- Large Central Mandala -->
  <g transform="translate(600, 200)" fill="none" stroke="#6B1D2A">
    <!-- 1. Outer dot ring (r=175, 24 dots, op 0.15) -->
    <g fill="#6B1D2A" stroke="none" opacity="0.15">
      <circle r="2.5" cx="0" cy="-175" transform="rotate(0)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(15)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(30)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(45)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(60)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(75)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(90)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(105)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(120)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(135)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(150)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(165)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(180)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(195)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(210)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(225)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(240)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(255)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(270)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(285)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(300)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(315)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(330)" />
      <circle r="2.5" cx="0" cy="-175" transform="rotate(345)" />
    </g>

    <!-- 2. Outer circle (r=170, stroke 1.2, op 0.12) -->
    <circle r="170" stroke-width="1.2" opacity="0.12" />

    <!-- 3. Outer petals (16 petals, cx=0, cy=-125, rx=9, ry=48, fill op 0.07, stroke op 0.10) -->
    <g opacity="0.10">
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(0)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(22.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(45)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(67.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(90)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(112.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(135)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(157.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(180)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(202.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(225)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(247.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(270)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(292.5)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(315)" />
      <ellipse cx="0" cy="-125" rx="9" ry="48" fill="#6B1D2A" fill-opacity="0.7" transform="rotate(337.5)" />
    </g>

    <!-- 4. Second circle (r=140, stroke 0.8, op 0.10) -->
    <circle r="140" stroke-width="0.8" opacity="0.10" />

    <!-- 5. Second dot ring (r=135, 16 dots offset by 11.25, op 0.12) -->
    <g fill="#6B1D2A" stroke="none" opacity="0.12">
      <circle r="2.5" cx="0" cy="-135" transform="rotate(11.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(33.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(56.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(78.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(101.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(123.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(146.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(168.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(191.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(213.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(236.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(258.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(281.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(303.75)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(326.25)" />
      <circle r="2.5" cx="0" cy="-135" transform="rotate(348.75)" />
    </g>

    <!-- 6. Middle petals (8 petals, cy=-90, rx=20, ry=45, fill 0.05, stroke 0.08) -->
    <g opacity="0.08">
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(0)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(45)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(90)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(135)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(180)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(225)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(270)" />
      <ellipse cx="0" cy="-90" rx="20" ry="45" fill="#6B1D2A" fill-opacity="0.625" transform="rotate(315)" />
    </g>

    <!-- 7. Third circle (r=100, stroke 0.6, op 0.08) -->
    <circle r="100" stroke-width="0.6" opacity="0.08" />

    <!-- 8. Third dot ring (r=95, 12 dots, op 0.10) -->
    <g fill="#6B1D2A" stroke="none" opacity="0.10">
      <circle r="2.5" cx="0" cy="-95" transform="rotate(0)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(30)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(60)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(90)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(120)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(150)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(180)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(210)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(240)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(270)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(300)" />
      <circle r="2.5" cx="0" cy="-95" transform="rotate(330)" />
    </g>

    <!-- 9. Inner petals (12 petals, cy=-58, rx=11, ry=32, fill 0.05, no stroke needed based on spec but keeping structure) -->
    <g fill="#6B1D2A" stroke="none" opacity="0.05">
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(0)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(30)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(60)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(90)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(120)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(150)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(180)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(210)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(240)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(270)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(300)" />
      <ellipse cx="0" cy="-58" rx="11" ry="32" transform="rotate(330)" />
    </g>

    <!-- 10. Inner circle (r=60, stroke 0.5, op 0.07) -->
    <circle r="60" stroke-width="0.5" opacity="0.07" />

    <!-- 11. Tiny petals (8, cy=-32, rx=7, ry=18, fill 0.04) -->
    <g fill="#6B1D2A" stroke="none" opacity="0.04">
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(0)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(45)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(90)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(135)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(180)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(225)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(270)" />
      <ellipse cx="0" cy="-32" rx="7" ry="18" transform="rotate(315)" />
    </g>

    <!-- 12. Center circles -->
    <circle r="38" stroke-width="1" opacity="0.06" />
    <circle r="18" stroke-width="1" opacity="0.08" />
    <circle r="7" fill="#6B1D2A" stroke="none" opacity="0.05" />
    <circle r="2.5" fill="#6B1D2A" stroke="none" opacity="0.10" />
  </g>

  <!-- Text -->
  <text x="600" y="210" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="82" fill="#6B1D2A" text-anchor="middle" letter-spacing="-1">Mahi Bagrecha</text>
  
  <!-- Line beneath name -->
  <rect x="500" y="230" width="200" height="1.5" fill="#6B1D2A" opacity="0.4" />
</svg>
