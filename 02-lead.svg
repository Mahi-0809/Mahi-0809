  <!-- Line 1 Text -->
  <text x="600" y="110" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#6B1D2A" text-anchor="middle" letter-spacing="1">A Developer · An AI/ML Engineer · Open to Hire</text>
  
  <!-- Accent bar below tagline -->
  <rect x="200" y="135" width="800" height="2" fill="#6B1D2A" opacity="0.25" />
  
  <!-- Email Text -->
  <text x="600" y="175" font-family="'Segoe UI', sans-serif" font-size="18" fill="#6B1D2A" opacity="0.7" text-anchor="middle" letter-spacing="2">bagrechamahi2810@gmail.com</text>

  <!-- Decorative dots flanking email -->
  <g fill="#6B1D2A" opacity="0.2">
    <circle cx="390" cy="169" r="2" />
    <circle cx="410" cy="169" r="2" />
    <circle cx="430" cy="169" r="2" />
    
    <circle cx="770" cy="169" r="2" />
    <circle cx="790" cy="169" r="2" />
    <circle cx="810" cy="169" r="2" />
