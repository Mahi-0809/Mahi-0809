<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <rect width="1200" height="260" fill="#FFF8F0" />
  
  <!-- Top line -->
  <rect x="0" y="20" width="1200" height="1.5" fill="#6B1D2A" opacity="0.2" />
  
  <!-- Bottom line -->
  <rect x="0" y="240" width="1200" height="1.5" fill="#6B1D2A" opacity="0.2" />

  <!-- Corner motifs -->
  <g fill="none" stroke="#6B1D2A">
    <!-- Top Right -->
    <g transform="translate(1160, 0)">
      <circle r="80" stroke-width="1.2" opacity="0.10" />
      <circle r="60" stroke-width="0.8" opacity="0.08" />
      <g fill="#6B1D2A" stroke="none" opacity="0.05">
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(0)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(45)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(90)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(135)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(180)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(225)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(270)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(315)" />
      </g>
      <circle r="30" stroke-width="0.5" opacity="0.06" />
      <circle r="15" fill="#6B1D2A" stroke="none" opacity="0.04" />
    </g>
    <!-- Bottom Left -->
    <g transform="translate(40, 260)">
      <circle r="80" stroke-width="1.2" opacity="0.10" />
      <circle r="60" stroke-width="0.8" opacity="0.08" />
      <g fill="#6B1D2A" stroke="none" opacity="0.05">
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(0)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(45)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(90)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(135)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(180)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(225)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(270)" />
        <ellipse cx="0" cy="-45" rx="8" ry="25" transform="rotate(315)" />
      </g>
      <circle r="30" stroke-width="0.5" opacity="0.06" />
      <circle r="15" fill="#6B1D2A" stroke="none" opacity="0.04" />
