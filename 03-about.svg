      <text x="92" y="232">AHI is a developer and designer who works at the</text>
      <text x="40" y="260">crossroads of machine learning and craft. The brief is</text>
      <text x="40" y="288">simple: build the system, then make it beautiful — never</text>
      <text x="40" y="316">in that order alone. Today&#39;s edition catalogues the tools,</text>
      <text x="40" y="344">interests, and current preoccupations of the writer.</text>
