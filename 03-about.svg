<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
    <rect width="1200" height="520" fill="#FFF8F0"/>
    
    <!-- Top accent line -->
    <rect x="0" y="15" width="1200" height="1.5" fill="#6B1D2A" opacity="0.15"/>
    
    <!-- Heading -->
    <text x="600" y="80" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="52" fill="#6B1D2A" text-anchor="middle" letter-spacing="2">I BUILD PROJECTS WITH</text>
    
    <!-- Thin line under heading -->
    <rect x="100" y="100" width="1000" height="2" fill="#6B1D2A" opacity="0.3"/>
    
    <!-- SKILLS COLUMNS -->
    <!-- Column 1 -->
    <g transform="translate(60, 140)">
        <rect width="240" height="30" fill="#6B1D2A" rx="2" ry="2"/>
        <text x="120" y="20" font-family="monospace" font-size="13" fill="#FFF8F0" text-anchor="middle" letter-spacing="3">FRONTEND</text>
        
        <text x="120" y="70" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">React.js</text>
        <circle cx="120" cy="90" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="110" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">JavaScript</text>
        <circle cx="120" cy="130" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="150" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">HTML/CSS</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(340, 140)">
        <rect width="240" height="30" fill="#6B1D2A" rx="2" ry="2"/>
        <text x="120" y="20" font-family="monospace" font-size="13" fill="#FFF8F0" text-anchor="middle" letter-spacing="3">BACKEND</text>
        
        <text x="120" y="70" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">Node.js</text>
        <circle cx="120" cy="90" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="110" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">Python</text>
        <circle cx="120" cy="130" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="150" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(620, 140)">
        <rect width="240" height="30" fill="#6B1D2A" rx="2" ry="2"/>
        <text x="120" y="20" font-family="monospace" font-size="13" fill="#FFF8F0" text-anchor="middle" letter-spacing="3">AI / ML</text>
        
        <text x="120" y="70" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">TensorFlow</text>
        <circle cx="120" cy="90" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="110" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">Machine Learning</text>
        <circle cx="120" cy="130" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="150" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">Data Science</text>
    </g>

    <!-- Column 4 -->
    <g transform="translate(900, 140)">
        <rect width="240" height="30" fill="#6B1D2A" rx="2" ry="2"/>
        <text x="120" y="20" font-family="monospace" font-size="13" fill="#FFF8F0" text-anchor="middle" letter-spacing="3">DESIGN</text>
        
        <text x="120" y="70" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">Figma</text>
        <circle cx="120" cy="90" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="110" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">Visual Systems</text>
        <circle cx="120" cy="130" r="1.5" fill="#6B1D2A" opacity="0.4"/>
        <text x="120" y="150" font-family="Georgia, serif" font-size="17" fill="#6B1D2A" text-anchor="middle">UI/UX</text>
    </g>

    <!-- DECORATIVE MANDALA ART -->
    <!-- Half-mandala right side (left half) -->
    <g transform="translate(1140, 300)">
        <!-- Layer 1 -->
        <circle cx="0" cy="0" r="120" fill="none" stroke="#6B1D2A" stroke-width="2" opacity="0.1"/>
        <circle cx="0" cy="0" r="100" fill="none" stroke="#6B1D2A" stroke-width="1" stroke-dasharray="4 4" opacity="0.12"/>
        <!-- Layer 2 Petals (left half only) -->
        <g stroke="#6B1D2A" stroke-width="1.5" fill="none" opacity="0.08">
            <ellipse cx="-50" cy="0" rx="30" ry="10" transform="rotate(0)"/>
            <ellipse cx="-43" cy="-25" rx="30" ry="10" transform="rotate(30)"/>
            <ellipse cx="-25" cy="-43" rx="30" ry="10" transform="rotate(60)"/>
            <ellipse cx="0" cy="-50" rx="30" ry="10" transform="rotate(90)"/>
            <ellipse cx="-43" cy="25" rx="30" ry="10" transform="rotate(-30)"/>
            <ellipse cx="-25" cy="43" rx="30" ry="10" transform="rotate(-60)"/>
            <ellipse cx="0" cy="50" rx="30" ry="10" transform="rotate(-90)"/>
        </g>
        <!-- Layer 3 Dots -->
        <g fill="#6B1D2A" opacity="0.12">
            <circle cx="-120" cy="0" r="3"/>
            <circle cx="-104" cy="-60" r="3"/>
            <circle cx="-60" cy="-104" r="3"/>
            <circle cx="0" cy="-120" r="3"/>
            <circle cx="-104" cy="60" r="3"/>
            <circle cx="-60" cy="104" r="3"/>
            <circle cx="0" cy="120" r="3"/>
        </g>
    </g>
    
    <!-- Quarter-mandala bottom left -->
    <g transform="translate(40, 520)">
        <circle cx="0" cy="0" r="50" fill="none" stroke="#6B1D2A" stroke-width="1.5" opacity="0.08"/>
        <circle cx="0" cy="0" r="35" fill="none" stroke="#6B1D2A" stroke-width="1" stroke-dasharray="3 3" opacity="0.1"/>
        <g stroke="#6B1D2A" stroke-width="1" fill="none" opacity="0.06">
            <ellipse cx="20" cy="-20" rx="15" ry="5" transform="rotate(-45)"/>
            <ellipse cx="0" cy="-28" rx="15" ry="5" transform="rotate(-90)"/>
            <ellipse cx="28" cy="0" rx="15" ry="5" transform="rotate(0)"/>
        </g>
        <g fill="#6B1D2A" opacity="0.08">
            <circle cx="50" cy="0" r="2"/>
            <circle cx="35" cy="-35" r="2"/>
            <circle cx="0" cy="-50" r="2"/>
        </g>
    </g>

    <!-- Tagline -->
    <text x="600" y="470" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#6B1D2A" text-anchor="middle" opacity="0.8">Precision in every line of code. Creativity in every solution. Perfection is the only standard.</text>

    <!-- Bottom accent line -->
    <rect x="0" y="500" width="1200" height="1.5" fill="#6B1D2A" opacity="0.15"/>
</svg>
